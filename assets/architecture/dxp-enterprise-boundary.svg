<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Digital Experience Platform — Enterprise Boundary</title>
  <desc id="desc">A composable digital experience platform boundary across channels, experience composition, content and product truth, identity, data, AI, commerce and foundations.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.band{fill:#10283e;stroke:#2d4d69;stroke-width:2}.box{fill:#102238;stroke:#31516f;stroke-width:2}.box2{fill:#171d38;stroke:#7766df;stroke-width:2}.label{fill:#55dced;font:700 14px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#b9c8d8;font:13px Arial}.tiny{fill:#90a4bb;font:11px Arial}.line{stroke:#51d9ec;stroke-width:3}.line2{stroke:#9d86ff;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text x="54" y="60" class="head">Digital Experience Platform — Enterprise Boundary</text><text x="54" y="86" class="body">Composable experience with governed identity, truth, data, AI and operational controls</text>
  <rect class="band" x="54" y="120" width="1092" height="69" rx="13"/><text class="label" x="74" y="148">CHANNELS</text><text class="body" x="186" y="148">Brand web · Commerce · Mobile · Email · HCP / B2B · Partner experiences</text><text class="tiny" x="74" y="173">Channel teams own journeys; platform teams own reusable capabilities and contracts</text>
  <line class="line2" x1="600" y1="189" x2="600" y2="222"/>
  <rect class="box" x="54" y="222" width="1092" height="88" rx="13"/><text class="label" x="74" y="251">EXPERIENCE COMPOSITION</text><text class="body" x="74" y="280">Headless delivery · UI composition · Personalisation · Search · Experimentation · Journey orchestration</text>
  <line class="line" x1="198" y1="310" x2="198" y2="344"/><line class="line2" x1="465" y1="310" x2="465" y2="344"/><line class="line" x1="732" y1="310" x2="732" y2="344"/><line class="line2" x1="999" y1="310" x2="999" y2="344"/>
  <rect class="box" x="54" y="344" width="255" height="126" rx="13"/><text class="label" x="74" y="374">CONTENT / PRODUCT TRUTH</text><text class="body" x="74" y="405">DAM · PIM · Claims</text><text class="body" x="74" y="430">Metadata · Provenance · Locale</text><text class="tiny" x="74" y="454">Authoritative ownership</text>
  <rect class="box" x="326" y="344" width="255" height="126" rx="13"/><text class="label" x="346" y="374">IDENTITY / CONSENT</text><text class="body" x="346" y="405">CIAM · Profile · Preference</text><text class="body" x="346" y="430">Progressive consent · Trust</text><text class="tiny" x="346" y="454">Purpose-bound access</text>
  <rect class="box2" x="598" y="344" width="255" height="126" rx="13"/><text class="label" x="618" y="374">DATA / AI</text><text class="body" x="618" y="405">CDP · Analytics · Semantics</text><text class="body" x="618" y="430">AI assistants · Decisioning</text><text class="tiny" x="618" y="454">Evidence &amp; measurement</text>
  <rect class="box2" x="870" y="344" width="276" height="126" rx="13"/><text class="label" x="890" y="374">COMMERCE ENGAGEMENT</text><text class="body" x="890" y="405">Cart · Catalogue · Promotions</text><text class="body" x="890" y="430">Campaign · Notification · CRM</text><text class="tiny" x="890" y="454">Transaction &amp; activation</text>
  <rect x="54" y="514" width="1092" height="83" rx="13" fill="#111a30" stroke="#7565dc" stroke-width="2"/><text class="label" x="74" y="545">FOUNDATIONS &amp; GOVERNANCE</text><text class="body" x="74" y="575">API / event integration · Security · Observability · Accessibility · Privacy · APM / CMDB · SRE · FinOps · Architecture standards</text>
  <text class="tiny" x="1146" y="636" text-anchor="end">Enterprise boundary: reusable truth and controls; differentiated experience at the edge</text>
</svg>
