<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Enterprise Integration</title>
  <desc id="desc">Public cloud, private cloud, SaaS and legacy systems connect through a governed integration control fabric and governance operations.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.box{fill:#102238;stroke:#31516f;stroke-width:2}.box2{fill:#171d38;stroke:#7565dd;stroke-width:2}.fabric{fill:#0e263a;stroke:#4bd7eb;stroke-width:2}.label{fill:#55dced;font:700 14px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#b9c8d8;font:13px Arial}.tiny{fill:#90a4bb;font:11px Arial}.line{stroke:#4bd7eb;stroke-width:3}.line2{stroke:#9c85ff;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text x="54" y="62" class="head">Hybrid Enterprise Integration</text><text x="54" y="88" class="body">Modernise incrementally while preserving contracts, security, lineage and recoverability</text>
  <rect class="box" x="54" y="140" width="245" height="140" rx="14"/><text class="label" x="75" y="171">PUBLIC CLOUD</text><text class="body" x="75" y="205">Kubernetes · Data · AI</text><text class="body" x="75" y="230">Managed integration</text><text class="tiny" x="75" y="255">Elastic · cloud-native</text>
  <rect class="box" x="317" y="140" width="245" height="140" rx="14"/><text class="label" x="338" y="171">PRIVATE CLOUD</text><text class="body" x="338" y="205">OpenShift · Services</text><text class="body" x="338" y="230">Regulated workloads</text><text class="tiny" x="338" y="255">Controlled runtime</text>
  <rect class="box2" x="580" y="140" width="245" height="140" rx="14"/><text class="label" x="601" y="171">SAAS</text><text class="body" x="601" y="205">CRM · Content · Workflow</text><text class="body" x="601" y="230">Analytics · Collaboration</text><text class="tiny" x="601" y="255">Vendor contracts</text>
  <rect class="box2" x="843" y="140" width="303" height="140" rx="14"/><text class="label" x="864" y="171">LEGACY / ERP</text><text class="body" x="864" y="205">On-prem · Databases · Batch</text><text class="body" x="864" y="230">File · Core systems</text><text class="tiny" x="864" y="255">Stability &amp; transition</text>
  <line class="line" x1="176" y1="280" x2="176" y2="329"/><line class="line" x1="439" y1="280" x2="439" y2="329"/><line class="line2" x1="702" y1="280" x2="702" y2="329"/><line class="line2" x1="994" y1="280" x2="994" y2="329"/>
  <rect class="fabric" x="92" y="329" width="1016" height="143" rx="16"/><text class="label" x="116" y="362">INTEGRATION CONTROL FABRIC</text><text class="body" x="116" y="396">API gateway · Event streaming · Service bus · Data contracts · Schema registry · Managed file transfer</text><text class="body" x="116" y="425">Identity · Secrets · Policy · Tracing · Replay · Audit · Throttling · Versioning</text><text class="tiny" x="116" y="452">Choose pattern by semantics and NFRs—not platform preference</text>
  <line class="line" x1="600" y1="472" x2="600" y2="514"/>
  <rect class="box" x="194" y="514" width="812" height="81" rx="13"/><text class="label" x="216" y="545">GOVERNANCE OPERATIONS</text><text class="body" x="216" y="573">Architecture decisions · Ownership · SLOs · DR · Security · Data residency · Cost · Change controls</text>
  <text class="tiny" x="1146" y="637" text-anchor="end">EA position: preserve domain contracts while platforms and runtimes evolve</text>
</svg>
