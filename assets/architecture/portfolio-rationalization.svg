<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio Transparency to Rationalization</title>
  <desc id="desc">Application facts connect to capabilities, dependencies and dispositions to answer transformation questions and enable leadership decisions.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems, inventory and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.box{fill:#102238;stroke:#31516f;stroke-width:2}.box2{fill:#171d38;stroke:#7565dd;stroke-width:2}.label{fill:#55dced;font:700 14px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#b9c8d8;font:13px Arial}.tiny{fill:#90a4bb;font:11px Arial}.flow{fill:none;stroke:#4bd7eb;stroke-width:3;marker-end:url(#a)}.flow2{fill:none;stroke:#9c85ff;stroke-width:3;marker-end:url(#b)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4bd7eb"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#9c85ff"/></marker></defs>
  <rect class="bg" width="1200" height="675"/><text x="54" y="62" class="head">Portfolio Transparency → Rationalization</text><text x="54" y="88" class="body">Inventory creates value when connected to capability, dependency, ownership and disposition</text>
  <rect class="box" x="54" y="150" width="230" height="130" rx="14"/><text class="label" x="74" y="181">FACT BASE</text><text class="body" x="74" y="215">Applications · Markets</text><text class="body" x="74" y="240">Owners · Lifecycle</text><text class="tiny" x="74" y="262">Evidence &amp; confidence</text>
  <rect class="box" x="342" y="150" width="230" height="130" rx="14"/><text class="label" x="362" y="181">CAPABILITIES</text><text class="body" x="362" y="215">L1–L4 business map</text><text class="body" x="362" y="240">Strategic fit · Maturity</text><text class="tiny" x="362" y="262">Demand language</text>
  <rect class="box2" x="630" y="150" width="230" height="130" rx="14"/><text class="label" x="650" y="181">DEPENDENCIES</text><text class="body" x="650" y="215">ERP · Data · Identity</text><text class="body" x="650" y="240">Interfaces · Criticality</text><text class="tiny" x="650" y="262">Transition constraints</text>
  <rect class="box2" x="918" y="150" width="228" height="130" rx="14"/><text class="label" x="938" y="181">DISPOSITION</text><text class="body" x="938" y="215">Invest · Reuse · Migrate</text><text class="body" x="938" y="240">Tolerate · Retire</text><text class="tiny" x="938" y="262">Decision &amp; owner</text>
  <path class="flow" d="M284 215h50"/><path class="flow2" d="M572 215h50"/><path class="flow2" d="M860 215h50"/>
  <rect class="box" x="126" y="382" width="420" height="140" rx="14"/><text class="label" x="148" y="414">TRANSFORMATION QUESTIONS</text><text class="body" x="148" y="450">Where is duplication? What breaks during transition?</text><text class="body" x="148" y="478">Which capabilities need one backbone vs local edge?</text><text class="tiny" x="148" y="505">Evidence turns inventory into architecture</text>
  <rect class="box2" x="654" y="382" width="420" height="140" rx="14"/><text class="label" x="676" y="414">LEADERSHIP DECISIONS</text><text class="body" x="676" y="450">Sequence · Fund · De-risk · Assign ownership</text><text class="body" x="676" y="478">Day 1 / Day 100 · Roadmap · TCO · Exceptions</text><text class="tiny" x="676" y="505">Decision quality and traceability</text>
  <path class="flow" d="M457 280c0 55-121 40-121 94"/><path class="flow2" d="M1032 280c0 55-168 40-168 94"/><path class="flow2" d="M546 452h100"/>
  <rect x="186" y="576" width="828" height="40" rx="10" fill="#0e1c2f"/><text class="tiny" x="600" y="601" text-anchor="middle">Architecture value: incomplete portfolio data becomes decision-quality evidence with explicit confidence</text>
</svg>
