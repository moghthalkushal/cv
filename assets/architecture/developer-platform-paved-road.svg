<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Developer Platform — Architecture as a Paved Road</title>
  <desc id="desc">Developer experience leads through build, delivery, runtime and operations on a self-service platform governed by policy architecture controls.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.band{fill:#10283e;stroke:#2e4e6a;stroke-width:2}.box{fill:#102238;stroke:#31516f;stroke-width:2}.box2{fill:#171d38;stroke:#7565dd;stroke-width:2}.label{fill:#55dced;font:700 14px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#b9c8d8;font:13px Arial}.tiny{fill:#90a4bb;font:11px Arial}.line{stroke:#4bd7eb;stroke-width:3}.line2{stroke:#9d86ff;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text x="54" y="62" class="head">Developer Platform — Architecture as a Paved Road</text><text x="54" y="88" class="body">Standards become adoptable when encoded into self-service engineering workflows</text>
  <rect class="band" x="54" y="126" width="1092" height="75" rx="13"/><text class="label" x="74" y="155">DEVELOPER EXPERIENCE</text><text class="body" x="260" y="155">Portal · Software catalogue · Docs · Golden-path templates · Onboarding</text><text class="tiny" x="74" y="181">Discover → create → ship → operate with evidence</text>
  <line class="line" x1="182" y1="201" x2="182" y2="242"/><line class="line2" x1="462" y1="201" x2="462" y2="242"/><line class="line" x1="742" y1="201" x2="742" y2="242"/><line class="line2" x1="1022" y1="201" x2="1022" y2="242"/>
  <rect class="box" x="54" y="242" width="250" height="154" rx="14"/><text class="label" x="75" y="274">BUILD</text><text class="body" x="75" y="309">Code · Contracts · Tests</text><text class="body" x="75" y="334">Dependency policy · SBOM</text><text class="tiny" x="75" y="370">Secure-by-default template</text>
  <rect class="box" x="322" y="242" width="250" height="154" rx="14"/><text class="label" x="343" y="274">DELIVER</text><text class="body" x="343" y="309">CI / CD · Promotion</text><text class="body" x="343" y="334">Canary · Rollback · Approval</text><text class="tiny" x="343" y="370">Traceable change</text>
  <rect class="box2" x="590" y="242" width="250" height="154" rx="14"/><text class="label" x="611" y="274">RUN</text><text class="body" x="611" y="309">Kubernetes · Serverless</text><text class="body" x="611" y="334">Config · Secrets · Scaling</text><text class="tiny" x="611" y="370">Standard runtime contracts</text>
  <rect class="box2" x="858" y="242" width="288" height="154" rx="14"/><text class="label" x="879" y="274">OPERATE</text><text class="body" x="879" y="309">OTel · SLOs · Incidents</text><text class="body" x="879" y="334">FinOps · Capacity · DR</text><text class="tiny" x="879" y="370">Evidence feeds standards</text>
  <rect x="54" y="445" width="1092" height="100" rx="15" fill="#111b31" stroke="#7666de" stroke-width="2"/><text class="label" x="74" y="478">POLICY / ARCHITECTURE CONTROLS</text><text class="body" x="74" y="510">Secure defaults · Reusable patterns · NFRs · Architecture decisions · Exception path · Service ownership · Compliance evidence</text>
  <line class="line2" x1="600" y1="396" x2="600" y2="445"/>
  <rect x="234" y="585" width="732" height="40" rx="10" fill="#0e1c2f"/><text class="tiny" x="600" y="610" text-anchor="middle">Goal: faster onboarding + safer autonomy + less architecture drift</text>
</svg>
