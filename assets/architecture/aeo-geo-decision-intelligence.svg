<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">AEO / GEO Decision Intelligence</title>
  <desc id="desc">External AI-search observations are ingested, canonicalised and interpreted before human policy gates, prioritised decisions, activation and feedback.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems, data and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.box{fill:#102238;stroke:#31506c;stroke-width:2}.box2{fill:#171d38;stroke:#7464db;stroke-width:2}.label{fill:#55dced;font:700 13px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#bac8d8;font:13px Arial}.tiny{fill:#8fa3ba;font:11px Arial}.flow{fill:none;stroke:#4bd7eb;stroke-width:3;marker-end:url(#a)}.act{fill:none;stroke:#f0ad36;stroke-width:3;marker-end:url(#c)}.feedback{fill:none;stroke:#9b84ff;stroke-width:3;marker-end:url(#b)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4bd7eb"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#9b84ff"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f0ad36"/></marker></defs>
  <rect class="bg" width="1200" height="675"/><text x="52" y="61" class="head">AEO / GEO Decision Intelligence</text><text x="52" y="87" class="body">External observations become governed signals, decisions and activation—not another dashboard</text>
  <g aria-label="Decision intelligence pipeline">
    <rect class="box" x="52" y="145" width="150" height="118" rx="13"/><text class="label" x="70" y="176">OBSERVE</text><text class="body" x="70" y="208">AI answers</text><text class="body" x="70" y="231">Search · Retail</text>
    <rect class="box" x="232" y="145" width="150" height="118" rx="13"/><text class="label" x="250" y="176">INGEST</text><text class="body" x="250" y="208">Batch · API</text><text class="body" x="250" y="231">Quality gates</text>
    <rect class="box" x="412" y="145" width="150" height="118" rx="13"/><text class="label" x="430" y="176">CANONICALISE</text><text class="body" x="430" y="208">Brand · Prompt</text><text class="body" x="430" y="231">Evidence · Source</text>
    <rect class="box2" x="592" y="145" width="150" height="118" rx="13"/><text class="label" x="610" y="176">INTERPRET</text><text class="body" x="610" y="208">Semantic layer</text><text class="body" x="610" y="231">Scoring · Trends</text>
    <rect class="box2" x="772" y="145" width="150" height="118" rx="13"/><text class="label" x="790" y="176">DECIDE</text><text class="body" x="790" y="208">Priority · Cause</text><text class="body" x="790" y="231">Recommendation</text>
    <rect class="box" x="952" y="145" width="196" height="118" rx="13"/><text class="label" x="970" y="176">ACT</text><text class="body" x="970" y="208">Brief · Workflow</text><text class="body" x="970" y="231">Controlled activation</text>
    <path class="act" d="M202 204h22"/><path class="flow" d="M382 204h22"/><path class="flow" d="M562 204h22"/><path class="feedback" d="M742 204h22"/><path class="act" d="M922 204h22"/>
  </g>
  <rect class="box" x="90" y="365" width="295" height="130" rx="14"/><text class="label" x="112" y="397">PRODUCT / CONTENT TRUTH</text><text class="body" x="112" y="430">Approved claims · Product data · Evidence</text><text class="body" x="112" y="456">Ownership · Version · Market applicability</text>
  <rect class="box2" x="452" y="365" width="295" height="130" rx="14"/><text class="label" x="474" y="397">HUMAN / POLICY GATES</text><text class="body" x="474" y="430">Business validation · Claims review</text><text class="body" x="474" y="456">Risk · Confidence · Approval evidence</text>
  <rect class="box2" x="814" y="365" width="295" height="130" rx="14"/><text class="label" x="836" y="397">ACTIVATION CHANNELS</text><text class="body" x="836" y="430">Content · Commerce · Media · Retailer</text><text class="body" x="836" y="456">Measurement · Experiment · Reassessment</text>
  <path class="flow" d="M487 263c0 55-250 34-250 94"/><path class="feedback" d="M667 263v94"/><path class="act" d="M847 263c0 55 115 34 115 94"/>
  <path class="feedback" d="M962 495c0 95-725 95-725 8"/>
  <rect x="210" y="563" width="780" height="42" rx="10" fill="#0e1c2f"/><text class="tiny" x="600" y="589" text-anchor="middle">Continuous loop: observe → validate → decide → activate → measure → re-observe</text>
</svg>
