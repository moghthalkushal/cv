<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Commercial Technology Capability Landscape</title>
  <desc id="desc">A capability landscape connecting business experience, revenue platforms, data and integration intelligence, and enterprise foundations.</desc>
  <metadata>Representative public-safe architecture. Employer-specific systems and confidential implementation details excluded.</metadata>
  <defs><style>.bg{fill:#07111f}.band{fill:#10283e;stroke:#2d4e6b;stroke-width:2}.box{fill:#101f33;stroke:#2f4d69;stroke-width:2}.box2{fill:#151c36;stroke:#7464db;stroke-width:2}.label{fill:#55dced;font:700 15px Arial}.head{fill:#f1f6fc;font:700 22px Arial}.body{fill:#b8c7d8;font:14px Arial}.small{fill:#90a3b9;font:12px Arial}.line{stroke:#42d3e7;stroke-width:3}.line2{stroke:#9b84ff;stroke-width:3}</style></defs>
  <rect class="bg" width="1200" height="675"/><text x="55" y="62" class="head">Commercial Technology Capability Landscape</text><text x="55" y="88" class="body">Capability-led planning across experience, revenue platforms, data and enterprise foundations</text>
  <rect class="band" x="55" y="125" width="1090" height="82" rx="14"/><text class="label" x="76" y="154">BUSINESS EXPERIENCE</text><text class="body" x="76" y="184">Consumers · Customers · Retailers · HCPs · Sales teams · Partners</text>
  <line class="line" x1="160" y1="207" x2="160" y2="245"/><line class="line2" x1="380" y1="207" x2="380" y2="245"/><line class="line" x1="600" y1="207" x2="600" y2="245"/><line class="line2" x1="820" y1="207" x2="820" y2="245"/><line class="line" x1="1040" y1="207" x2="1040" y2="245"/>
  <g aria-label="Commercial capability domains">
    <rect class="box" x="55" y="245" width="200" height="134" rx="13"/><text class="label" x="75" y="275">SALES TECH</text><text class="body" x="75" y="309">TPx · Field sales</text><text class="body" x="75" y="334">Trade · Planning</text><text class="small" x="75" y="358">Account &amp; execution</text>
    <rect class="box" x="272" y="245" width="200" height="134" rx="13"/><text class="label" x="292" y="275">MARTECH</text><text class="body" x="292" y="309">Campaigns · CRM</text><text class="body" x="292" y="334">Media · Engagement</text><text class="small" x="292" y="358">Audience &amp; activation</text>
    <rect class="box2" x="489" y="245" width="200" height="134" rx="13"/><text class="label" x="509" y="275">COMMERCE</text><text class="body" x="509" y="309">Retail · DTC</text><text class="body" x="509" y="334">Digital shelf · AEO/GEO</text><text class="small" x="509" y="358">Transactions &amp; truth</text>
    <rect class="box2" x="706" y="245" width="200" height="134" rx="13"/><text class="label" x="726" y="275">HCP / B2B</text><text class="body" x="726" y="309">Professional journeys</text><text class="body" x="726" y="334">Partner enablement</text><text class="small" x="726" y="358">Consent &amp; service</text>
    <rect class="box" x="923" y="245" width="222" height="134" rx="13"/><text class="label" x="943" y="275">EXPERIENCE PLATFORM</text><text class="body" x="943" y="309">Web · App · Content</text><text class="body" x="943" y="334">Identity · Consent</text><text class="small" x="943" y="358">Composition &amp; reuse</text>
  </g>
  <rect class="band" x="55" y="415" width="1090" height="82" rx="14"/><text class="label" x="76" y="444">DATA, INTEGRATION &amp; INTELLIGENCE</text><text class="body" x="76" y="474">APIs · Events · Master product / customer data · Analytics · Semantic metrics · AI / Agents · Decision intelligence</text>
  <rect x="55" y="533" width="1090" height="72" rx="14" fill="#111a30" stroke="#7a69df" stroke-width="2"/><text class="label" x="76" y="562">ENTERPRISE FOUNDATIONS</text><text class="body" x="76" y="590">Cloud · Identity · Cyber · Observability · Platform engineering · APM / CMDB · Architecture governance · FinOps</text>
  <text class="small" x="1145" y="640" text-anchor="end">EA position: common backbone, controlled local edge</text>
</svg>
