<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Governed Agentic AI Platform</title>
  <desc id="desc">A governed agentic AI platform separating business channels, agent experience, orchestration, AI control plane, gateway, models, enterprise knowledge and AgentOps with cross-cutting controls.</desc>
  <metadata>Conceptual public-safe architecture. This exact topology is not represented as deployed at Kenvue.</metadata>
  <defs><style>.bg{fill:#07111f}.band{fill:#10283e;stroke:#2c4c69;stroke-width:2}.box{fill:#102238;stroke:#31516e;stroke-width:2}.control{fill:#171d38;stroke:#7566dd;stroke-width:2}.label{fill:#56dced;font:700 14px Arial}.head{fill:#f2f6fc;font:700 22px Arial}.body{fill:#bac8d8;font:13px Arial}.tiny{fill:#90a3ba;font:11px Arial}.flow{fill:none;stroke:#4bd7eb;stroke-width:3;marker-end:url(#a)}.flow2{fill:none;stroke:#9c86ff;stroke-width:3;marker-end:url(#b)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4bd7eb"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#9c86ff"/></marker></defs>
  <rect class="bg" width="1200" height="675"/><text x="52" y="58" class="head">Governed Agentic AI Platform</text><text x="52" y="84" class="body">Separate experience, autonomy, policy, models, data and operational evidence</text>
  <rect class="band" x="52" y="112" width="1096" height="66" rx="13"/><text class="label" x="72" y="140">BUSINESS CHANNELS / USE CASES</text><text class="body" x="72" y="163">Workbench · Portal · API · Copilot surfaces · Business workflows</text>
  <rect class="box" x="52" y="215" width="190" height="154" rx="13"/><text class="label" x="70" y="243">AGENT EXPERIENCE</text><text class="body" x="70" y="274">Interaction patterns</text><text class="body" x="70" y="298">Human approvals</text><text class="body" x="70" y="322">Context &amp; feedback</text><text class="tiny" x="70" y="349">Business-owned journeys</text>
  <rect class="box" x="260" y="215" width="190" height="154" rx="13"/><text class="label" x="278" y="243">AGENT RUNTIME</text><text class="body" x="278" y="274">Router · Supervisor</text><text class="body" x="278" y="298">State · Checkpoints</text><text class="body" x="278" y="322">Skills · Memory policy</text><text class="tiny" x="278" y="349">Bounded autonomy</text>
  <rect class="control" x="468" y="215" width="190" height="154" rx="13"/><text class="label" x="486" y="243">AI CONTROL PLANE</text><text class="body" x="486" y="274">Registry · Identity</text><text class="body" x="486" y="298">Delegation · Budget</text><text class="body" x="486" y="322">Evaluation · Guardrails</text><text class="tiny" x="486" y="349">Policy &amp; approval</text>
  <rect class="control" x="676" y="215" width="190" height="154" rx="13"/><text class="label" x="694" y="243">AI GATEWAY</text><text class="body" x="694" y="274">Routing · Quotas</text><text class="body" x="694" y="298">Safety · Prompt policy</text><text class="body" x="694" y="322">Model abstraction</text><text class="tiny" x="694" y="349">Governed access</text>
  <rect class="box" x="884" y="215" width="264" height="154" rx="13"/><text class="label" x="902" y="243">MODELS</text><text class="body" x="902" y="274">Frontier LLMs · Embeddings</text><text class="body" x="902" y="298">Classifiers · Domain models</text><text class="body" x="902" y="322">Model-specific controls</text><text class="tiny" x="902" y="349">Fit-for-purpose selection</text>
  <path class="flow" d="M147 178v29"/><path class="flow" d="M242 292h10"/><path class="flow" d="M450 292h10"/><path class="flow2" d="M658 292h10"/><path class="flow2" d="M866 292h10"/>
  <rect class="band" x="52" y="407" width="538" height="92" rx="13"/><text class="label" x="72" y="437">ENTERPRISE KNOWLEDGE / TOOLS / DATA</text><text class="body" x="72" y="466">Search · SQL · Knowledge · APIs · Events · Documents</text><text class="tiny" x="72" y="486">Least-privilege tool access · data contracts · provenance</text>
  <rect class="band" x="610" y="407" width="538" height="92" rx="13"/><text class="label" x="630" y="437">AGENTOPS / OBSERVABILITY</text><text class="body" x="630" y="466">Traces · tokens / cost · quality · latency · incidents · audit</text><text class="tiny" x="630" y="486">SLOs · evaluations · evidence lineage · change history</text>
  <path class="flow" d="M355 369v30"/><path class="flow2" d="M563 369v22c0 28 316 2 316 8"/>
  <rect x="52" y="535" width="1096" height="75" rx="13" fill="#111a2d" stroke="#2a425b" stroke-width="2"/><text class="label" x="72" y="565">CROSS-CUTTING ENTERPRISE CONTROLS</text><text class="body" x="72" y="593">Identity · Security · Privacy · Responsible AI · Data residency · Cost · Resilience · Audit · Change governance</text>
  <text class="tiny" x="1148" y="645" text-anchor="end">EA gate: explicit evidence and decision ownership before production scaling</text>
</svg>
